[package]
name = "ini-edit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

# The same tables as ../Cargo.toml: these targets compile the oracles in
# tests/support/ too, and clippy reads ../clippy.toml for them.
[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
needless_collect = "warn"
redundant_clone = "warn"
use_self = "warn"

[dependencies]
# 0.4.7 is the oldest release whose fuzz_target! accepts the targets'
# expression bodies, such as `|data: &[u8]| round_trip::check(data)`.
libfuzzer-sys = "0.4.7"

[dependencies.ini-edit]
path = ".."

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
doc = false

[[bin]]
name = "editor"
path = "fuzz_targets/editor.rs"
doc = false

[[bin]]
name = "editor_reparse"
path = "fuzz_targets/editor_reparse.rs"
doc = false

[[bin]]
name = "editor_stateful"
path = "fuzz_targets/editor_stateful.rs"
doc = false

[[bin]]
name = "generated_edits"
path = "fuzz_targets/generated_edits.rs"
doc = false

[[bin]]
name = "inputs"
path = "fuzz_targets/inputs.rs"
doc = false

[workspace]
