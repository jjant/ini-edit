[package]
name = "ini-edit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }

[dependencies.ini-edit]
path = ".."

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
doc = false

[[bin]]
name = "editor"
path = "fuzz_targets/editor.rs"
doc = false

[[bin]]
name = "editor_reparse"
path = "fuzz_targets/editor_reparse.rs"
doc = false

[[bin]]
name = "editor_stateful"
path = "fuzz_targets/editor_stateful.rs"
doc = false

[[bin]]
name = "generated_edits"
path = "fuzz_targets/generated_edits.rs"
doc = false

[workspace]
