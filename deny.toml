[graph]
all-features = true

[advisories]
ignore = []
# Vulnerability, notice and unmaintained advisories are errors by default.
# These two settings make this check cover everything that
# `cargo audit --deny warnings` reported, so CI runs only cargo-deny.
yanked = "deny"
unsound = "all"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions among normal dependencies fail. Dev-dependencies are
# exempt (multiple-versions-include-dev defaults to false); they currently
# resolve two versions each of getrandom and wit-bindgen.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
