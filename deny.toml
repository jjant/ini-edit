[graph]
all-features = true

[advisories]
ignore = []
# Vulnerability and notice advisories are always errors. These three make
# every other finding of `cargo audit --deny warnings` an error as well, for
# direct and transitive dependencies alike, so CI runs only cargo-deny. They
# are set even where they match today's defaults, because no cargo-audit step
# would catch a narrower default in a later cargo-deny.
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
]
confidence-threshold = 0.8

[bans]
# Two versions of one normal dependency fail, because users of the crate
# compile both. Dev-dependencies only build this repository's tests and
# tools, so they are exempt; they resolve two versions each of getrandom and
# wit-bindgen today.
multiple-versions = "deny"
multiple-versions-include-dev = false
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
