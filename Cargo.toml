[package]
name = "ini-edit"
version = "0.4.0"
edition = "2024"
description = "A lossless, format-preserving INI parser built on rowan — parse, inspect, and edit INI files without losing comments, whitespace, or ordering"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jjant/ini-edit"
keywords = ["ini", "parser", "lossless", "format-preserving", "config"]
categories = ["config", "parser-implementations"]
rust-version = "1.85"
# Ship the tests with every file they read, insta snapshots included, so that
# `cargo test` passes on the published sources. Leave out only what this
# repository alone uses: CI, the fuzz workspace, the committed fuzz inputs, the
# test that replays them and the editor oracles that only it and the fuzz
# targets use, and the release-plz, ripsecrets, Codecov, and cargo-deny
# configuration. The round-trip oracle ships because tests/exhaustive_parser.rs
# uses it. CI's `package` job runs the shipped tests and requires every other
# tracked file to ship; its repository_only list must name the same files.
exclude = [
    "/.github/",
    "/fuzz/",
    "/tests/fuzz_regressions/",
    "/tests/fuzz_regressions.rs",
    "/tests/support/editor_inputs.rs",
    "/tests/support/editor_ops.rs",
    "/tests/support/editor_reparse.rs",
    "/tests/support/editor_stateful.rs",
    "/tests/support/editor_walk.rs",
    "/tests/support/generated_edits.rs",
    "/.release-plz.toml",
    "/.secretsignore",
    "/codecov.yml",
    "/deny.toml",
]

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
rowan = "0.16"

[dev-dependencies]
insta = "1"
criterion = { version = "0.5", features = ["html_reports"] }
rust-ini = "0.21.3"
configparser = "3.1.0"
ini_core = "0.2.0"

[[bench]]
name = "parse"
harness = false

# The editor's oracles parse thousands of small documents, and a debug build
# reparses the whole document after every edit to check that its tree equals a
# parse of its text. Optimizing rowan, the tree library, and its dependencies
# makes those debug runs about four times faster. This crate stays unoptimized,
# with debug assertions and overflow checks, so tests still exercise them.
[profile.dev.package.rowan]
opt-level = 3

[profile.dev.package.countme]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package.rustc-hash]
opt-level = 3

[profile.dev.package.text-size]
opt-level = 3
