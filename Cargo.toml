[package]
name = "ini-edit"
version = "0.4.0"
edition = "2024"
# A line-ending backslash joins the lines, without the line break and indentation.
description = """\
    A lossless, format-preserving INI parser built on rowan — parse, inspect, and edit INI \
    files without losing comments, whitespace, or ordering"""
license = "MIT"
readme = "README.md"
repository = "https://github.com/jjant/ini-edit"
keywords = ["ini", "parser", "lossless", "format-preserving", "config"]
categories = ["config", "parser-implementations"]
rust-version = "1.85"
# Ship the tests with every file they read, insta snapshots included, so that
# `cargo test` passes on the published sources. Leave out only what this
# repository alone uses: CI, the fuzz workspace, the committed fuzz inputs, the
# test that replays them and the editor oracles that only it and the fuzz
# targets use, and the release-plz, ripsecrets, Codecov, and cargo-deny
# configuration. The round-trip oracle ships because tests/exhaustive_parser.rs
# uses it. CI's `package` job runs the shipped tests and requires every other
# tracked file to ship; its repository_only list must name the same files.
exclude = [
    "/.github/",
    "/fuzz/",
    "/tests/fuzz_regressions/",
    "/tests/fuzz_regressions.rs",
    "/tests/support/editor_inputs.rs",
    "/tests/support/editor_ops.rs",
    "/tests/support/editor_reparse.rs",
    "/tests/support/editor_stateful.rs",
    "/tests/support/editor_walk.rs",
    "/tests/support/generated_edits.rs",
    "/.release-plz.toml",
    "/.secretsignore",
    "/codecov.yml",
    "/deny.toml",
]

# fuzz/Cargo.toml repeats both tables: the fuzz crate is a workspace of its own,
# and it compiles tests/support/ too.
[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every exception is an #[expect] that states its reason, so it fails once it is
# no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
needless_collect = "warn"
redundant_clone = "warn"
use_self = "warn"

[dependencies]
rowan = "0.17"

# rust-ini and configparser are independent parsers: the differential tests
# compare ini-edit's values with theirs, and the benchmark times all three.
# Each requirement is a caret range from a release that the tests and the
# benchmark work with; older ones, such as rust-ini 0.21.0 and configparser
# 3.0.0, lack APIs they call. Cargo.lock records the newest releases, and
# `cargo update` moves it.
[dev-dependencies]
insta = "1"
rust-ini = "0.21.3"
configparser = "3.1.0"

# benches/parse.rs is its own harness, with std only.
[[bench]]
name = "parse"
harness = false

# The editor's oracles parse thousands of small documents, and a debug build
# reparses the whole document after every edit to check that its tree equals a
# parse of its text. Optimizing rowan, the tree library, and its dependencies
# makes those debug runs about four times faster. This crate stays unoptimized,
# with debug assertions and overflow checks, so tests still exercise them. The
# list is rowan 0.17 and its five dependencies; memoffset only has macros,
# which expand into rowan's code, so its entry keeps the list complete.
[profile.dev.package.rowan]
opt-level = 3

[profile.dev.package.countme]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package.memoffset]
opt-level = 3

[profile.dev.package.rustc-hash]
opt-level = 3

[profile.dev.package.text-size]
opt-level = 3

# The extended tests: release speed with the checks of a debug build, which a
# plain release build compiles out: debug_assert!, code under
# cfg(debug_assertions) (among it the editor's reparse after every edit), and
# arithmetic overflow checks. CI's extended-tests job runs the ignored tests
# with `cargo test --profile release-checked`. It builds into
# target/release-checked, so it leaves release builds, such as the scaling
# probe, untouched.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
