name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's superseded run.
# Every other run (main, schedule, dispatch) gets a group of its own, so it is
# never cancelled or queued behind another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

# Every action is pinned to a full commit SHA; Dependabot proposes updates.
# Runner images are pinned to what the -latest labels resolved to on
# 2026-10-18 (ubuntu-24.04, macos-26, windows-2025).
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- --deny warnings

      - name: Build all targets
        run: cargo build --locked --all-targets --all-features

      - name: Test debug configuration
        run: cargo test --locked --all-targets --all-features

      - name: Test release configuration
        run: cargo test --locked --release --all-targets --all-features

      - name: Test documentation
        run: cargo test --locked --doc --all-features

      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: --deny warnings

      # Last, so that a stale fuzz lockfile never hides the results above.
      - name: Require an up-to-date fuzz lockfile
        # fuzz/ is a separate workspace, so a release bumps ini-edit in
        # Cargo.lock but not in fuzz/Cargo.lock. release-pr.yml refreshes it on
        # release pull requests; elsewhere, the error below says how.
        run: |
          if ! cargo metadata --locked --format-version 1 \
            --manifest-path fuzz/Cargo.toml > /dev/null; then
            echo "::error file=fuzz/Cargo.lock::If cargo says the lock file needs an update," \
              "run 'cargo update --manifest-path fuzz/Cargo.toml --package ini-edit'" \
              "and commit fuzz/Cargo.lock."
            exit 1
          fi

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features

  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-targets --all-features

  # The other jobs test the repository; this one tests the crate that
  # `cargo publish` uploads, the sources that users, distribution packagers,
  # and crater runs test. It fails if a test stops shipping or ships without
  # a file it reads.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Ship every tracked file except the repository-only ones
        # repository_only names the files that package.exclude in Cargo.toml
        # leaves out, one extended regular expression per line, each matched
        # against whole paths. The step keeps its own copy on purpose: to stop
        # shipping a test or its data, a pull request has to change both
        # lists, so the test step below cannot turn green because failing
        # tests left the crate.
        shell: bash
        run: |
          repository_only='\.github/.+
          fuzz/.+
          tests/fuzz_regressions/.+
          tests/fuzz_regressions\.rs
          tests/support/(editor_ops|editor_reparse|editor_stateful|generated_edits)\.rs
          \.release-plz\.toml
          \.secretsignore
          codecov\.yml
          deny\.toml'
          packaged=$(cargo package --locked --list)
          if grep --line-regexp --extended-regexp "$repository_only" <<< "$packaged"; then
            echo "::error file=Cargo.toml::Only this repository uses the files above;" \
              "add them to package.exclude."
            exit 1
          fi
          # Every other tracked file ships, and so do the two files cargo
          # generates. core.quotePath=false prints non-ASCII names as cargo does.
          tracked=$(git -c core.quotePath=false ls-files \
            | grep --invert-match --line-regexp --extended-regexp "$repository_only")
          shipped=$(grep --invert-match --line-regexp --extended-regexp \
            'Cargo\.toml\.orig|\.cargo_vcs_info\.json' <<< "$packaged")
          if ! diff --unchanged-line-format= \
            --old-line-format='Left out: %L' \
            --new-line-format='Ships but git does not track it: %L' \
            <(sort <<< "$tracked") <(sort <<< "$shipped"); then
            echo "::error file=Cargo.toml::Ship the files left out above or, if only this" \
              "repository uses them, add them to package.exclude and to repository_only" \
              "in ci.yml."
            exit 1
          fi
      - name: Build the crate as crates.io will receive it
        # Like `cargo publish`, this also builds the library from the packaged
        # sources.
        run: cargo package --locked
      - name: Test the packaged crate outside the repository
        # Extracted outside the checkout, the crate builds as it does for
        # anyone who downloads it: no repository file or Cargo configuration
        # applies. --no-fail-fast names every failing target in one run.
        shell: bash
        env:
          # Never cache this directory. Cargo dates every file in a .crate
          # 2006-07-24, so it would treat an earlier build of the same version
          # as up to date and rerun its old test binaries on changed sources.
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target
        run: |
          crate=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq --raw-output \
              '.packages[] | select(.name == "ini-edit") | "\(.name)-\(.version)"')
          tar --extract --gzip --directory "$RUNNER_TEMP" \
            --file "target/package/$crate.crate"
          cd "$RUNNER_TEMP/$crate"
          cargo test --locked --all-targets --all-features --no-fail-fast
          cargo test --locked --doc --all-features

  extended-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Exhaustive inputs and large documents
        run: |
          cargo test --locked --release --test exhaustive_parser --test stress \
            -- --include-ignored
      - name: Build isolated scaling probe
        run: cargo build --locked --release --example scaling_probe
      - name: Check CPU and peak-memory growth
        run: python3 .github/scripts/check_scaling.py
      - name: Preserve scaling measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: input-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/scaling-report.json
          if-no-files-found: ignore
          retention-days: 14

  miri-strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lexer and diagnostics with borrow checking enabled
        run: |
          cargo miri test --locked --lib lexer::tests::
          cargo miri test --locked --test exhaustive_parser \
            lexer_and_diagnostic_contracts -- --exact

  miri:
    name: miri (${{ matrix.partition }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # `cargo miri test` ran the 203 library tests one at a time in a single
    # process: 31.9 minutes on 2026-10-18 and up to 40 minutes before. nextest
    # gives each test its own Miri process and runs one per CPU, four on this
    # runner, so a leg takes about as long as its slowest test; the slowest
    # takes 4.8 minutes. Replaying the 2026-10-18 test times through these
    # partitions predicts at most 6 minutes per leg, and about 7 on runners as
    # slow as in the 40-minute run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The values only name the legs; the test step numbers them.
        partition: [1, 2, 3, 4]
    env:
      # rowan 0.16.1 has an open provenance-model failure upstream:
      # https://github.com/rust-analyzer/rowan/issues/192
      # Keep all other Miri checks enabled until rowan ships a fix.
      MIRIFLAGS: -Zmiri-disable-stacked-borrows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-nextest@0.9.145
      - name: Library tests in this partition
        env:
          # Taken from the matrix itself, so every leg divides by the same
          # count and the legs together run each test exactly once.
          PARTITION_INDEX: ${{ strategy.job-index }}
          PARTITION_COUNT: ${{ strategy.job-total }}
        # nextest numbers partitions from 1. Hashing keeps a test in its
        # partition when other tests are added or removed. --no-fail-fast
        # runs the rest of the partition after a failure. Each test has its
        # own Miri process, so undefined behavior in one test no longer stops
        # the rest, as it did in the single `cargo miri test` process.
        run: |
          cargo miri nextest run --locked --lib --no-fail-fast \
            --test-threads num-cpus \
            --partition "hash:$((PARTITION_INDEX + 1))/$PARTITION_COUNT"

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-deny@0.20.2
      # deny.toml makes yanked crates and unsound or unmaintained advisories
      # errors, which covers everything `cargo audit --deny warnings` checked.
      - name: Advisories, yanked crates, licenses, duplicate dependencies, and sources
        run: cargo deny --locked check advisories bans licenses sources

  mutation:
    name: mutation (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # Unsharded, mutation testing took 19.8 minutes at the median and 24.7 at
    # most over the last 60 runs, depending on runner load. Every shard repeats
    # the setup and the 14-second baseline. Replaying the per-mutant times of
    # the 2026-10-18 run (474 mutants in 18.0 minutes) through these shards
    # predicts at most 5 minutes per shard, and about 7 on runners as slow as
    # in the 24.7-minute run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The values only name the shards; the mutation step numbers them.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.145
      - name: Require no surviving mutation in this shard
        shell: bash
        env:
          # Taken from the matrix itself, so every shard divides by the same
          # count and the shards together test each mutant exactly once.
          # cargo-mutants numbers shards from 0, as strategy.job-index does.
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          mkdir --parents target/mutation-ci
          set +o errexit
          # Round-robin deals the lexer and parser mutants, which cause most
          # timeouts, to every shard. The default, slice, would give one shard
          # 23 of the 39 timeouts.
          cargo mutants \
            --all-features \
            --caught \
            --test-tool nextest \
            --jobs 4 \
            --timeout 30 \
            --cap-lints true \
            --cargo-arg=--locked \
            --shard "$SHARD_INDEX/$SHARD_COUNT" \
            --sharding round-robin \
            --output target/mutation-ci
          status=$?
          set -o errexit

          report=target/mutation-ci/mutants.out/outcomes.json
          jq '{total_mutants, caught, timeout, unviable, missed}' "$report"
          {
            echo "### Mutation testing, shard $((SHARD_INDEX + 1)) of $SHARD_COUNT"
            echo
            jq --raw-output '
              ["Outcome", "Count"],
              ["---", "---:"],
              ["Mutations tested", .total_mutants],
              ["Detected by failing tests", .caught],
              ["Stopped at timeout", .timeout],
              ["Did not compile", .unviable],
              ["Survived (must be 0)", .missed]
              | "| \(.[0]) | \(.[1]) |"
            ' "$report"
            echo
            echo "Timeouts stop mutated test runs; they do not mean the unmodified tests hung."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(jq --raw-output '.missed' "$report")" -eq 0

          # cargo-mutants exits 3 for both survivors and detected timeouts.
          # Survivors were rejected above; timeouts are mutations that make
          # parser/lexer progress loops hang and are therefore detected.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

  fuzz:
    runs-on: ubuntu-24.04
    # Scheduled runs, and pushes whose version is not released yet, fuzz each
    # of the five targets for 15 minutes; the longest observed run took 76
    # minutes including the builds.
    timeout-minutes: 100
    env:
      # The only list of fuzz targets in this file. A step below checks it
      # against fuzz/Cargo.toml, so a new target cannot be skipped silently.
      FUZZ_TARGETS: round_trip editor editor_reparse editor_stateful generated_edits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-17
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-fuzz@0.13.2
      - name: Require FUZZ_TARGETS to name every fuzz target
        shell: bash
        run: |
          listed=$(tr ' ' '\n' <<< "$FUZZ_TARGETS" | sort | paste --serial --delimiters=' ')
          declared=$(cargo fuzz list | sort | paste --serial --delimiters=' ')
          if [ "$listed" != "$declared" ]; then
            echo "::error file=fuzz/Cargo.toml::FUZZ_TARGETS in ci.yml lists '$listed'," \
              "but fuzz/Cargo.toml declares '$declared'."
            exit 1
          fi
      - name: Fetch fuzz dependencies exactly as locked
        # cargo-fuzz has no --locked flag. Once this succeeds the lockfile is
        # consistent, so the fuzz builds below use it unchanged.
        run: |
          if ! cargo fetch --locked --manifest-path fuzz/Cargo.toml; then
            echo "::error file=fuzz/Cargo.lock::If cargo says the lock file needs an update," \
              "run 'cargo update --manifest-path fuzz/Cargo.toml --package ini-edit'" \
              "and commit fuzz/Cargo.lock."
            exit 1
          fi
      - name: Restore learned fuzz corpus
        id: restore-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          # Corpus files are raw inputs that stay valid when dependencies
          # change, so the key depends on no file: the save step below reuses
          # this exact key, and the prefix restores the newest saved corpus.
          # Change v1 only if the input encoding of a target changes.
          key: fuzz-corpus-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ runner.os }}-
      - name: Add reproducible starting cases
        run: python3 .github/scripts/seed_fuzz_corpus.py
      - name: Replay committed fuzz regressions
        # Each file under tests/fuzz_regressions/<target>/ runs once, whole,
        # and then also seeds that target's campaign below. An entry that is
        # not a target's directory, or not a file inside one, fails the step
        # instead of being skipped.
        shell: bash
        run: |
          regressions=tests/fuzz_regressions
          if [ ! -e "$regressions" ]; then
            echo "$regressions does not exist; there is nothing to replay."
            exit 0
          fi
          is_target() {
            local target
            for target in $FUZZ_TARGETS; do
              if [ "$1" = "$target" ]; then
                return 0
              fi
            done
            return 1
          }
          shopt -s nullglob dotglob
          for entry in "$regressions"/*; do
            if ! is_target "${entry#"$regressions/"}"; then
              echo "::error file=$entry::$entry is not named after a fuzz target" \
                "($FUZZ_TARGETS)."
              exit 1
            fi
            if [ ! -d "$entry" ]; then
              echo "::error file=$entry::$entry must be a directory of inputs."
              exit 1
            fi
          done
          for target in $FUZZ_TARGETS; do
            inputs=("$regressions/$target"/*)
            for input in "${inputs[@]}"; do
              if [ ! -f "$input" ]; then
                echo "::error file=$input::$input must be a file; each file is one input."
                exit 1
              fi
            done
            if [ "${#inputs[@]}" -eq 0 ]; then
              continue
            fi
            mkdir --parents "fuzz/corpus/$target"
            cp --target-directory="fuzz/corpus/$target" -- "${inputs[@]}"
            cargo fuzz run \
              --target x86_64-unknown-linux-gnu "$target" "${inputs[@]}" -- \
              -runs=0 -timeout=10 -rss_limit_mb=1024
          done
      - name: Fuzz parser and editor
        shell: bash
        run: |
          seconds=10
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            seconds=900
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            seconds=60
            # release-plz skips a version whose v<version> tag exists. Without
            # the tag, `release` may upload this very commit after this run,
            # so it gets the scheduled soak; so does a failed tag lookup.
            version=$(cargo metadata --locked --no-deps --format-version 1 \
              | jq --exit-status --raw-output \
                '.packages[] | select(.name == "ini-edit") | .version')
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "No v$version tag found, so this push may publish v$version."
              seconds=900
            fi
          fi
          echo "Fuzzing each target for $seconds seconds."
          status=0
          for target in $FUZZ_TARGETS; do
            max_len=16384
            if [ "$target" = editor_stateful ]; then
              max_len=515
            elif [ "$target" = generated_edits ]; then
              max_len=4096
            fi
            cargo fuzz run \
              --target x86_64-unknown-linux-gnu "$target" -- \
              -max_len="$max_len" -max_total_time="$seconds" \
              -timeout=10 -rss_limit_mb=1024 || status=1
          done
          exit "$status"
      - name: Preserve crashes and timeout reproducers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 90
      - name: Save learned corpus from main
        if: >-
          always()
          && github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
          && steps.restore-corpus.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: ${{ steps.restore-corpus.outputs.cache-primary-key }}

  # The 100% coverage gates. Called from here, they run in this run, on this
  # commit, so `required` can wait for them.
  coverage:
    # Not $/: actionlint 1.7.12 rejects that syntax, and for a reusable
    # workflow both forms resolve to this commit before any job starts.
    uses: ./.github/workflows/coverage.yml # zizmor: ignore[self-repository]
    # Only the Codecov upload's secret; these jobs need no publishing token.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # One check that stands for every gate: `release` needs it, and so can a
  # branch rule. It runs however the gates end, because GitHub reports a
  # skipped job as successful to branch rules, and it fails unless each gate
  # succeeded.
  required:
    if: always()
    needs:
      - check
      - msrv
      - platforms
      - package
      - extended-tests
      - miri-strict
      - miri
      - dependencies
      - mutation
      - fuzz
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every other job to be a gate or the release
        # Checks the wiring that makes `release` wait for every gate:
        # - every job except `release` is a gate listed above;
        # - `release` is the only job that needs this one;
        # - `release` has exactly the `if:` in RELEASE_IF;
        # - no other workflow runs on pushes: `release` cannot wait for its
        #   jobs, as it could not wait for coverage.yml's before.
        shell: bash
        env:
          RELEASE_IF: needs.required.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ci=.github/workflows/ci.yml
          jobs=$(yq --output-format=json '.jobs' "$ci")
          # A job's needs is one job name or a list of them.
          after=$(jq --raw-output '
            . as $jobs
            | [keys[] | select([$jobs[.].needs] | flatten | any(.[]; . == "required"))]
            | join(" ")' <<< "$jobs")
          gates=$(jq --raw-output '
            . as $jobs
            | [keys[]
                | select(. != "required")
                | select([$jobs[.].needs] | flatten | any(.[]; . == "required") | not)]
            | join(" ")' <<< "$jobs")
          needed=$(jq --raw-output 'keys | join(" ")' <<< "$NEEDS")
          release_if=$(jq --raw-output '.release.if' <<< "$jobs")
          status=0
          if [ "$gates" != "$needed" ]; then
            echo "::error file=$ci::The required job needs '$needed'," \
              "but the jobs that do not need it are '$gates'."
            status=1
          fi
          if [ "$after" != release ]; then
            echo "::error file=$ci::Only release may need the required job," \
              "but the jobs that need it are '$after'."
            status=1
          fi
          if [ "$release_if" != "$RELEASE_IF" ]; then
            echo "::error file=$ci::The release job must have this if: $RELEASE_IF." \
              "It has: $release_if"
            status=1
          fi
          shopt -s nullglob
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ "$workflow" = "$ci" ]; then
              continue
            fi
            # on is one event name, a list of them, or a map keyed by them.
            if yq --output-format=json '.on' "$workflow" | jq --exit-status '
              [if type == "object" then keys else . end]
              | flatten
              | any(.[]; . == "push")' > /dev/null; then
              echo "::error file=$workflow::$workflow runs on push, but release waits" \
                "only for the jobs of ci.yml. Trigger it with workflow_call and call it" \
                "from ci.yml instead."
              status=1
            fi
          done
          exit "$status"
      - name: Require every gate to succeed
        shell: bash
        run: |
          jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null

  # The only job that publishes: on a push to main, after every gate passed on
  # that commit in this run. release-plz publishes the version in Cargo.toml
  # unless its v<version> tag exists or crates.io has it, so most pushes
  # publish nothing.
  release:
    needs: [required]
    # The first condition states what GitHub's implicit success() already
    # requires. The required job checks that this line stays as it is.
    if: needs.required.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # release-plz pushes tags and creates GitHub releases through the GitHub
    # API with the RELEASE_PLZ_TOKEN personal access token, so the automatic
    # token only needs to read the repository. 0.4.0 was published with the
    # repository default, which is read-only as well.
    permissions:
      contents: read
    # One release at a time, and an upload in progress is never cancelled.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # release-plz does not push with git (tags are unsigned), so the
          # checkout token need not stay in .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # v0.5.140 runs release-plz 0.3.170, which published 0.4.0.
      - uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
