name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build all targets
        run: cargo build --all-targets --all-features

      - name: Test debug configuration
        run: cargo test --all-targets --all-features

      - name: Test release configuration
        run: cargo test --release --all-targets --all-features

      - name: Test documentation
        run: cargo test --doc --all-features

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-targets --all-features

  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features

  extended-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Exhaustive inputs and large documents
        run: cargo test --release --test exhaustive_parser --test stress -- --include-ignored
      - name: Build isolated scaling probe
        run: cargo build --release --example scaling_probe
      - name: Check CPU and peak-memory growth
        run: python3 .github/scripts/check_scaling.py
      - name: Preserve scaling measurements
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: input-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/scaling-report.json
          if-no-files-found: ignore
          retention-days: 14

  miri-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Lexer and diagnostics with borrow checking enabled
        run: |
          cargo miri test --lib lexer::tests::
          cargo miri test --test exhaustive_parser lexer_and_diagnostic_contracts -- --exact

  miri:
    runs-on: ubuntu-latest
    env:
      # rowan 0.16.1 has an open provenance-model failure upstream:
      # https://github.com/rust-analyzer/rowan/issues/192
      # Keep all other Miri checks enabled until rowan ships a fix.
      MIRIFLAGS: -Zmiri-disable-stacked-borrows
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test --lib

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.16
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Security advisories, unsoundness, and yanked crates
        run: cargo audit --deny warnings
      - name: Licenses, duplicate dependencies, and sources
        run: cargo deny check advisories bans licenses sources

  mutation:
    runs-on: ubuntu-latest
    # The existing suite takes about 18.5 minutes; leave room for new oracles.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.16
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.145
      - name: Require no surviving mutation
        shell: bash
        run: |
          mkdir -p target/mutation-ci
          set +e
          cargo mutants \
            --all-features \
            --caught \
            --test-tool nextest \
            --jobs 4 \
            --timeout 30 \
            --cap-lints true \
            --output target/mutation-ci
          status=$?
          set -e

          report=target/mutation-ci/mutants.out/outcomes.json
          jq '{total_mutants, caught, timeout, unviable, missed}' "$report"
          {
            echo "### Mutation testing"
            echo
            jq -r '
              ["Outcome", "Count"],
              ["---", "---:"],
              ["Mutations tested", .total_mutants],
              ["Detected by failing tests", .caught],
              ["Stopped at timeout", .timeout],
              ["Did not compile", .unviable],
              ["Survived (must be 0)", .missed]
              | "| \(.[0]) | \(.[1]) |"
            ' "$report"
            echo
            echo "Timeouts stop mutated test runs; they do not mean the unmodified tests hung."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(jq -r '.missed' "$report")" -eq 0

          # cargo-mutants exits 3 for both survivors and detected timeouts.
          # Survivors were rejected above; timeouts are mutations that make
          # parser/lexer progress loops hang and are therefore detected.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.87.16
        with:
          tool: cargo-fuzz
      - name: Restore learned fuzz corpus
        uses: actions/cache/restore@v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}-
      - name: Add reproducible starting cases
        run: python3 .github/scripts/seed_fuzz_corpus.py
      - name: Fuzz parser and editor
        run: |
          seconds=10
          if [ "${{ github.event_name }}" = "push" ]; then
            seconds=60
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            seconds=900
          fi
          status=0
          for target in round_trip editor editor_reparse editor_stateful generated_edits; do
            max_len=16384
            if [ "$target" = editor_stateful ]; then
              max_len=515
            elif [ "$target" = generated_edits ]; then
              max_len=4096
            fi
            cargo +nightly fuzz run \
              --target x86_64-unknown-linux-gnu "$target" -- \
              -max_len="$max_len" -max_total_time="$seconds" \
              -timeout=10 -rss_limit_mb=1024 || status=1
          done
          exit "$status"
      - name: Preserve crashes and timeout reproducers
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Save learned corpus from main
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
