name: Release PR

on:
  workflow_dispatch:

# release-plz pushes the release branch and opens the pull request, and the
# step after it commits the fuzz lockfile, through the GitHub API with the
# RELEASE_PLZ_TOKEN personal access token (so CI runs on that pull request).
# The automatic token therefore only needs to read the repository.
permissions:
  contents: read

# A second dispatch waits for the first instead of racing it on the same branch.
concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Neither release-plz nor the step after it pushes with git (both
          # commit through the GitHub API), so the checkout token need not
          # stay in .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # Without a version input, the action installs the release-plz that its
      # newest v0.5 release names: 0.4.0 on 2026-10-23. release-plz 0.3.170
      # opened the ini-edit 0.4.0 release pull request.
      # Preparing a crates.io release needs no registry token, so none is
      # passed to this job.
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # fuzz/ is a separate workspace, so release-plz bumps ini-edit in
      # Cargo.lock but not in fuzz/Cargo.lock, and CI fails on a stale fuzz
      # lockfile. prs_created is true whenever release-plz opened or rewrote
      # the pull request, and either way its branch lacks this commit again.
      # (release-plz treats this commit as a contributor's, so its next run
      # closes the pull request and opens a new one, which gets it again.)
      - name: Refresh fuzz/Cargo.lock on the release pull request
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: |
          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/release" FETCH_HEAD
          cd "$RUNNER_TEMP/release"
          cargo update --manifest-path fuzz/Cargo.toml --package ini-edit
          if git diff --quiet -- fuzz/Cargo.lock; then
            echo "fuzz/Cargo.lock on $RELEASE_BRANCH is already up to date."
            exit 0
          fi
          git diff -- fuzz/Cargo.lock
          # A commit made with the personal access token triggers CI.
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/fuzz/Cargo.lock" \
            --raw-field branch="$RELEASE_BRANCH" \
            --raw-field sha="$(git rev-parse HEAD:fuzz/Cargo.lock)" \
            --raw-field content="$(base64 --wrap=0 fuzz/Cargo.lock)" \
            --raw-field message="chore: update fuzz/Cargo.lock to the release version" \
            --jq .commit.html_url
