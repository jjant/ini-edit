name: Nightly fuzzing

# Hours of fuzzing for every target, every night, on main. ci.yml's fuzz job
# gives each target 10 seconds per pull request, 60 seconds per push and 15
# minutes on Sundays and before a release; this workflow is the long campaign.
# It is not a pull request check and the release does not wait for it: a
# finding fails the run, and GitHub reports a failed scheduled run to whoever
# last changed its cron line.
on:
  schedule:
    # 21:23 UTC: off the top of the hour, when GitHub delays scheduled runs,
    # outside the hours most commits land, and done before ci.yml's Sunday
    # run at 03:17.
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: >-
          Seconds to fuzz each target, at most 18000. Use about 300 to check
          a change to this workflow.
        type: number
        required: true
        # MAX_SECONDS below.
        default: 18000

permissions:
  contents: read

# One campaign at a time: a run that starts while another is in progress
# waits for it instead of cancelling hours of fuzzing, and the two never
# compete for the same corpus caches.
concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

# Explicit bash adds pipefail, which the fuzz step's tee needs.
defaults:
  run:
    shell: bash

# No RUSTFLAGS=--deny warnings, unlike ci.yml: ci.yml gates warnings, and a
# new nightly lint must not cost a night of fuzzing.
env:
  CARGO_TERM_COLOR: always
  # The default and the largest budget: 300 minutes of fuzzing, plus up to 5
  # while the last libFuzzer jobs finish, 20 for minimization and about 10 for
  # the build, the replay and the caches, fit in timeout-minutes below.
  MAX_SECONDS: 18000

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # GitHub stops any job after 360 minutes; this limit leaves room for the
    # if: always() steps that save the corpus and upload findings.
    timeout-minutes: 350
    strategy:
      # Each target is an independent campaign: one finding must not stop
      # the other five.
      fail-fast: false
      matrix:
        # -max_len of each target, as in ci.yml's fuzz job and TESTING.md's
        # table of input lengths. A step below checks that this list names
        # every target of fuzz/Cargo.toml exactly once.
        include:
          - target: round_trip
            max_len: 16384
          - target: editor
            max_len: 16384
          - target: editor_reparse
            max_len: 16384
          - target: editor_stateful
            max_len: 515
          - target: generated_edits
            max_len: 4096
          - target: inputs
            max_len: 256
    env:
      TARGET: ${{ matrix.target }}
      MAX_LEN: ${{ matrix.max_len }}
      # Empty on schedule; the step below then uses MAX_SECONDS.
      SECONDS_INPUT: ${{ inputs.seconds }}
    steps:
      - name: Choose the fuzzing time
        run: |
          seconds=$MAX_SECONDS
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            seconds=$SECONDS_INPUT
          fi
          # Digits only, and no more of them than MAX_SECONDS has, so that
          # the comparisons below cannot overflow.
          case $seconds in
            '' | *[!0-9]*) seconds=invalid ;;
          esac
          if [ "${#seconds}" -gt "${#MAX_SECONDS}" ]; then
            seconds=invalid
          fi
          if [ "$seconds" = invalid ] || [ "$seconds" -lt 1 ] \
            || [ "$seconds" -gt "$MAX_SECONDS" ]; then
            echo "::error::seconds must be a whole number from 1 to $MAX_SECONDS," \
              "not '$SECONDS_INPUT'."
            exit 1
          fi
          echo "FUZZ_SECONDS=$seconds" >> "$GITHUB_ENV"
          echo "Fuzzing $TARGET for $seconds seconds."
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      # No rust-cache: building one target takes a minute or two of a
      # five-hour job, and the repository's cache space is better spent on
      # corpora.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Require the matrix to name every fuzz target once
        run: |
          workflow=.github/workflows/fuzz-nightly.yml
          listed=$(yq '.jobs.fuzz.strategy.matrix.include[].target' "$workflow" \
            | sort | paste --serial --delimiters=' ')
          declared=$(cargo fuzz list | sort | paste --serial --delimiters=' ')
          if [ "$listed" != "$declared" ]; then
            echo "::error file=$workflow::The matrix lists '$listed'," \
              "but fuzz/Cargo.toml declares '$declared'."
            exit 1
          fi
      - name: Fetch fuzz dependencies exactly as locked
        # cargo-fuzz has no --locked flag. Once this succeeds the lockfile is
        # consistent, so the fuzz builds below use it unchanged.
        run: |
          if ! cargo fetch --locked --manifest-path fuzz/Cargo.toml; then
            echo "::error file=fuzz/Cargo.lock::If cargo says the lock file needs an update," \
              "run 'cargo update --manifest-path fuzz/Cargo.toml --package ini-edit'" \
              "and commit fuzz/Cargo.lock."
            exit 1
          fi
      - name: Build the fuzz target
        run: cargo fuzz build --target x86_64-unknown-linux-gnu "$TARGET"

      - name: Restore the corpus of ci.yml's fuzz job
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus
          # ci.yml saves fuzz/corpus, all six targets, under
          # fuzz-corpus-v1-<os>-<run>-<attempt>. No run saves this exact
          # key, so the prefix restores the newest of them.
          key: fuzz-corpus-v1-${{ runner.os }}-nightly
          restore-keys: fuzz-corpus-v1-${{ runner.os }}-
      - name: Restore this target's nightly corpus
        id: restore-corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # The save step reuses this exact key, and the prefix restores the
          # newest saved corpus. As in ci.yml, the key depends on no file,
          # because corpus files stay valid when the code changes. Change v1
          # only if the input encoding of a target changes.
          key: fuzz-nightly-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-nightly-v1-${{ matrix.target }}-
      - name: Add reproducible starting cases and the committed inputs
        id: seed
        # ci.yml's fuzz job checks that tests/fuzz_regressions/ holds only
        # files in target directories, and tests/fuzz_regressions.rs that no
        # target's directory is empty.
        run: |
          python3 .github/scripts/seed_fuzz_corpus.py
          cp --target-directory="fuzz/corpus/$TARGET" -- "tests/fuzz_regressions/$TARGET"/*
          echo "files=$(find "fuzz/corpus/$TARGET" -type f | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Replay the starting corpus
        # Fork mode below starts with a merge that discards its output: an
        # input that crashes on today's code is dropped, counted as no crash,
        # and leaves only its file under fuzz/artifacts. Running every input
        # once first fails this step instead, with the stack trace in the log.
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- \
            -runs=0 -max_len="$MAX_LEN" -timeout=10 -rss_limit_mb=1024
      - name: Fuzz with every core
        id: fuzz
        # Also after a failed replay, which has already failed the job: the
        # campaign may find more.
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        # With -fork, libFuzzer runs one fuzzing process per core and merges
        # what they learn into fuzz/corpus/$TARGET. The -ignore_* flags record
        # each crash, timeout or out-of-memory input under fuzz/artifacts and
        # start a new process instead of ending the campaign.
        run: |
          status=0
          cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- \
            -fork="$(nproc)" -ignore_crashes=1 -ignore_timeouts=1 -ignore_ooms=1 \
            -max_total_time="$FUZZ_SECONDS" -max_len="$MAX_LEN" \
            -timeout=10 -rss_limit_mb=1024 \
            2>&1 | tee "$RUNNER_TEMP/fuzz.log" || status=$?
          echo "files=$(find "fuzz/corpus/$TARGET" -type f | wc -l)" >> "$GITHUB_OUTPUT"
          # In fork mode, libFuzzer exits with the status of the last process
          # it waited for, so an ignored finding can end the campaign with a
          # nonzero status. The last step fails the job for every finding.
          if [ "$status" -ne 0 ]; then
            if [ -z "$(find "fuzz/artifacts/$TARGET" -type f -print -quit)" ]; then
              echo "::error::Fuzzing exited with status $status and recorded no input."
              exit "$status"
            fi
            echo "Fuzzing exited with status $status after recording the inputs above."
          fi
      - name: Minimize the corpus
        id: minimize
        if: ${{ !cancelled() && steps.fuzz.outcome == 'success' }}
        # This is the merge that `cargo fuzz cmin` runs, but cmin exits with
        # status 0 even when the merge fails (see TESTING.md), so the step
        # runs the merge itself and replaces the corpus only when the merge
        # succeeds and keeps an input. A merge that outlasts its 20 minutes
        # leaves the corpus as it is.
        run: |
          corpus=fuzz/corpus/$TARGET
          merged=$RUNNER_TEMP/minimized
          mkdir "$merged"
          status=0
          timeout 20m cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" \
            "$merged" "$corpus" -- \
            -merge=1 -max_len="$MAX_LEN" -timeout=10 -rss_limit_mb=1024 || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::warning::Minimizing took more than 20 minutes; the corpus is saved as it is."
          elif [ "$status" -ne 0 ]; then
            echo "::error::The merge failed with status $status; the corpus is saved as it is."
          elif [ -z "$(find "$merged" -type f -print -quit)" ]; then
            echo "::error::The merge kept no input; the corpus is saved as it is."
            status=1
          else
            rm --recursive -- "$corpus"
            mv -- "$merged" "$corpus"
            echo "files=$(find "$corpus" -type f | wc -l)" >> "$GITHUB_OUTPUT"
          fi
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Save the corpus from main
        # Also after a failure or a timeout: every input in the corpus is one
        # that added coverage.
        if: >-
          always()
          && github.ref == 'refs/heads/main'
          && steps.restore-corpus.outputs.cache-primary-key != ''
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ steps.restore-corpus.outputs.cache-primary-key }}
      - name: Preserve crash, timeout and out-of-memory inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-nightly-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 90
      - name: Summarize and require no findings
        if: always()
        env:
          START_FILES: ${{ steps.seed.outputs.files }}
          FUZZED_FILES: ${{ steps.fuzz.outputs.files }}
          MINIMIZED_FILES: ${{ steps.minimize.outputs.files }}
          ARTIFACT: fuzz-nightly-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The fork-mode status line that libFuzzer prints after each job:
          # #<executions>: cov: <n> ft: <n> corp: <n> exec/s: <n>
          # oom/timeout/crash: <n>/<n>/<n> time: <n>s job: <n> dft_time: <n>
          status_line=
          if [ -f "$RUNNER_TEMP/fuzz.log" ]; then
            status_line=$(grep --extended-regexp '^#[0-9]+: cov: ' "$RUNNER_TEMP/fuzz.log" \
              | tail --lines=1 || true)
          fi
          pattern='^#([0-9]+): cov: ([0-9]+) ft: ([0-9]+) corp: [0-9]+ exec/s: ([0-9]+) '
          pattern+='oom/timeout/crash: ([0-9]+)/([0-9]+)/([0-9]+) time: ([0-9]+)s'
          executions=unknown coverage=unknown speed=unknown counts=unknown elapsed=unknown
          if [[ $status_line =~ $pattern ]]; then
            executions=${BASH_REMATCH[1]}
            coverage="${BASH_REMATCH[2]} edges, ${BASH_REMATCH[3]} features"
            speed="${BASH_REMATCH[4]} per second"
            counts="${BASH_REMATCH[7]} / ${BASH_REMATCH[6]} / ${BASH_REMATCH[5]}"
            elapsed="${BASH_REMATCH[8]} s"
          fi
          artifacts=fuzz/artifacts/$TARGET
          findings=()
          if [ -d "$artifacts" ]; then
            mapfile -t findings < <(find "$artifacts" -type f -printf '%f\n' | sort)
          fi
          {
            echo "## $TARGET"
            echo
            echo "| Measure | Value |"
            echo "|---|---|"
            echo "| Fuzzing time | ${FUZZ_SECONDS:-unknown} s requested, $elapsed run," \
              "on $(nproc) cores |"
            echo "| Executions | $executions ($speed) |"
            echo "| Coverage | $coverage |"
            echo "| Corpus files at the start | ${START_FILES:-unknown} |"
            echo "| Corpus files after fuzzing | ${FUZZED_FILES:-unknown} |"
            echo "| Corpus files after minimization | ${MINIMIZED_FILES:-not minimized} |"
            echo "| Crashes / timeouts / out-of-memory inputs counted by libFuzzer | $counts |"
            echo "| Files under fuzz/artifacts/$TARGET | ${#findings[@]} |"
            if [ "${#findings[@]}" -gt 0 ]; then
              echo
              echo "Download the inputs, then replay one (see TESTING.md):"
              echo
              echo '```sh'
              echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY" \
                "--name $ARTIFACT --dir $ARTIFACT"
              echo "cargo +nightly fuzz run $TARGET $ARTIFACT/${findings[0]}"
              echo '```'
              echo
              for finding in "${findings[@]:0:50}"; do
                echo "- \`$finding\`"
              done
              if [ "${#findings[@]}" -gt 50 ]; then
                echo "- and $(( ${#findings[@]} - 50 )) more"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#findings[@]}" -gt 0 ]; then
            echo "::error::Fuzzing $TARGET found ${#findings[@]} inputs;" \
              "they are in the $ARTIFACT artifact."
            exit 1
          fi
