name: Coverage

# Only ci.yml runs these jobs, as part of its own run on the same commit, so
# its `required` job, and with it the release, waits for both coverage gates.
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        # Pull requests from forks and from Dependabot get no repository
        # secrets. The upload is advisory, so the gates run without it.
        required: false

permissions:
  contents: read

# No concurrency block: ci.yml's group already cancels a pull request's
# superseded run, these jobs included. In a called workflow, github.workflow
# names the caller, so a group here would repeat ci.yml's, and GitHub cancels
# a run whose called workflow waits on the caller's own group as a deadlock.

env:
  CARGO_TERM_COLOR: always

jobs:
  branch:
    name: branches (100%)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-17
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      # One instrumented run feeds both the gate and the Codecov upload.
      - name: Measure production source with branch coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --lib --all-features --branch --no-report
          cargo llvm-cov report --branch --lcov --output-path lcov.info
          cargo llvm-cov report --branch --json --summary-only --output-path branch-coverage.json
      - name: Require 100% branches, functions, instantiations, lines, and regions
        run: |
          jq '.data[0].totals' branch-coverage.json
          jq --exit-status '
            .data[0].totals
            | [
                .branches.percent,
                .functions.percent,
                .instantiations.percent,
                .lines.percent,
                .regions.percent
              ]
            | all(. == 100)
          ' branch-coverage.json
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          # The jq step above is the gate. Codecov is advisory, so an outage
          # on its side must not fail this job.
          fail_ci_if_error: false

  mcdc:
    name: MC/DC (100%)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2025-06-01
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure and require 100% MC/DC
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov \
            --locked \
            --lib \
            --all-features \
            --mcdc \
            --json \
            --summary-only \
            --output-path mcdc-coverage.json
          jq '.data[0].totals' mcdc-coverage.json
          jq --exit-status '
            .data[0].totals
            | [
                .mcdc.percent,
                .branches.percent,
                .functions.percent,
                .instantiations.percent,
                .lines.percent,
                .regions.percent
              ]
            | all(. == 100)
          ' mcdc-coverage.json
