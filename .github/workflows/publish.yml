name: Publish

on:
  push:
    branches: [main]

# release-plz pushes tags and creates GitHub releases through the GitHub API
# with the RELEASE_PLZ_TOKEN personal access token, so the automatic token
# only needs to read the repository (the repository default is read-only too).
permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # release-plz does not push with git (tags are unsigned), so the
          # checkout token need not stay in .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # v0.5.140 runs release-plz 0.3.170, which published 0.4.0.
      - uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
