[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
semver_check = true
pr_labels = ["release"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Keep a Changelog's order: the HTML comments sort the groups and the
# template strips them. Breaking changes of any type go under Changed, and
# protect_breaking_commits keeps a breaking refactor or chore from being
# skipped.
commit_parsers = [
    { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Changed" },
    { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->Changed" },
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^refactor", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
]
protect_breaking_commits = true
